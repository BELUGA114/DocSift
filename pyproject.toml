[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ppt-to-docx"
version = "0.1.0"
description = "Traceable photographed PPT to DOCX pipeline"
requires-python = ">=3.13"
dependencies = [
  "openai>=1.109.0",
  "pillow>=11.0.0",
  "pydantic>=2.10.0",
  "python-docx>=1.1.2",
  "python-dotenv>=1.0.1",
  "typer>=0.15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]

[project.scripts]
ppt-to-docx = "ppt_to_docx.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

